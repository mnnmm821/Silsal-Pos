[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = ["python3 -m ensurepip --upgrade", "python3 -m pip install --no-cache-dir -r requirements.txt"]

[phases.build]
cmds = ["python3 -c \"from app import init_db; init_db()\" || true"]

[start]
cmd = "gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
